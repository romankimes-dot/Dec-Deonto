<body>
  <header class="top">
    <div><h1>DEC · Épreuve 1</h1><div class="sub">Réglementation professionnelle et déontologie EC / CAC</div></div>
    <div class="row" style="gap:8px;flex-wrap:nowrap"><div id="streak" class="streak"></div><button class="btn sm" id="glossBtn" aria-label="Glossaire"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></svg></button><button class="btn sm" id="settingsBtn" aria-label="Réglages"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div>
  </header>
  <main id="main"><div class="card">Chargement…</div></main>
  <nav class="bottom"></nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="celebrate" id="celebrate" role="dialog" aria-modal="true" aria-live="polite" tabindex="-1"></div>
  <script>
    // Secours : si l'app n'a pas démarré après 8 s alors qu'un service worker sert la page (cache incohérent,
    // module introuvable), on vide les caches (sauf les podcasts téléchargés), on retire le service worker et on recharge, une fois par session.
    setTimeout(function () {
      var m = document.getElementById('main');
      if (!m || m.textContent.trim() !== 'Chargement…' || !navigator.serviceWorker || !navigator.serviceWorker.controller) return;
      try { if (sessionStorage.getItem('dec1.boot-recover')) return; sessionStorage.setItem('dec1.boot-recover', '1'); } catch (e) { return; }
      var done = function () { location.reload(); };
      Promise.all([
        navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }),
        window.caches ? caches.keys().then(function (ks) { return Promise.all(ks.filter(function (k) { return k !== 'dec1-audio'; }).map(function (k) { return caches.delete(k); })); }) : null
      ]).then(done, done);
    }, 8000);
  </script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>

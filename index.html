<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DEC UE1 Déontologie</title>
  <meta name="description" content="Révision de l'épreuve 1 du DEC : réglementation professionnelle et déontologie de l'expert-comptable et du commissaire aux comptes. Répétition espacée, QCM, QRC, examens blancs. Hors ligne.">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="DEC UE1">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <header class="top">
    <div><h1>DEC · Épreuve 1</h1><div class="sub">Réglementation professionnelle et déontologie EC / CAC</div></div>
    <div class="row" style="gap:8px;flex-wrap:nowrap"><div id="streak" class="streak"></div><button class="btn sm" id="glossBtn" aria-label="Glossaire"><span aria-hidden="true">📖</span></button><button class="btn sm" id="settingsBtn" aria-label="Réglages"><span aria-hidden="true">⚙︎</span></button></div>
  </header>
  <main id="main"><div class="card">Chargement…</div></main>
  <nav class="bottom"></nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="celebrate" id="celebrate" role="dialog" aria-modal="true" aria-live="polite" tabindex="-1"></div>
  <script>
    // Secours : si l'app n'a pas démarré après 8 s alors qu'un service worker sert la page (cache incohérent,
    // module introuvable), on vide les caches (sauf les podcasts téléchargés), on retire le service worker et on recharge, une fois par session.
    setTimeout(function () {
      var m = document.getElementById('main');
      if (!m || m.textContent.trim() !== 'Chargement…' || !navigator.serviceWorker || !navigator.serviceWorker.controller) return;
      try { if (sessionStorage.getItem('dec1.boot-recover')) return; sessionStorage.setItem('dec1.boot-recover', '1'); } catch (e) { return; }
      var done = function () { location.reload(); };
      Promise.all([
        navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }),
        window.caches ? caches.keys().then(function (ks) { return Promise.all(ks.filter(function (k) { return k !== 'dec1-audio'; }).map(function (k) { return caches.delete(k); })); }) : null
      ]).then(done, done);
    }, 8000);
  </script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
